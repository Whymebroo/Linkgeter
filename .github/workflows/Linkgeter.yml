name: TikTok link

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'اسم پیج تیک‌تاک (مثل: cristiano)'
        required: true
        type: string
      count:
        description: 'تعداد ویدیو'
        required: false
        type: number
        default: 10

permissions:
  contents: write

jobs:
  get-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository (fast)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install yt-dlp
        run: |
          pip install -q -U yt-dlp
          echo "✅ yt-dlp version: $(yt-dlp --version)"

      - name: Extract TikTok video links
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          COUNT="${{ github.event.inputs.count }}"
          
          # حذف @ از اول اسم
          USERNAME_CLEAN=$(echo "$USERNAME" | sed 's/^@//')
          
          # ساخت پوشه links
          OUTPUT_DIR="links"
          mkdir -p "$OUTPUT_DIR"
          
          # ساخت لینک کامل پروفایل
          PROFILE_URL="https://www.tiktok.com/@${USERNAME_CLEAN}"
          
          echo "🔍 در حال گرفتن لینک ویدیوهای ${USERNAME_CLEAN}..."
          echo "🎯 تعداد درخواستی: $COUNT"
          echo "🌐 لینک پروفایل: $PROFILE_URL"
          
          # استخراج لینک ویدیوها با yt-dlp
          if yt-dlp \
            --flat-playlist \
            --print "%(webpage_url)s" \
            --playlist-end "${COUNT}" \
            --no-check-certificate \
            --extractor-args "tiktok:embed_logger" \
            "$PROFILE_URL" > "${OUTPUT_DIR}/${USERNAME_CLEAN}.txt" 2>/tmp/error.log; then
            
            LINK_COUNT=$(wc -l < "${OUTPUT_DIR}/${USERNAME_CLEAN}.txt")
            
            # حذف خطوط خالی احتمالی
            sed -i '/^$/d' "${OUTPUT_DIR}/${USERNAME_CLEAN}.txt"
            LINK_COUNT=$(wc -l < "${OUTPUT_DIR}/${USERNAME_CLEAN}.txt")
            
            if [ "$LINK_COUNT" -eq 0 ]; then
              echo "⚠️ هیچ ویدیویی پیدا نشد! ممکنه پیج خصوصی یا نامعتبر باشه."
              echo "📝 خطای احتمالی:"
              cat /tmp/error.log | head -5
            else
              echo "✅ ${LINK_COUNT} لینک ویدیو استخراج شد"
              echo ""
              echo "===== پیش‌نمایش لینک‌ها ====="
              head -5 "${OUTPUT_DIR}/${USERNAME_CLEAN}.txt"
              echo "..."
            fi
          else
            echo "❌ خطا در استخراج لینک‌ها!"
            echo "📝 جزئیات خطا:"
            cat /tmp/error.log
            exit 1
          fi
          
          echo ""
          echo "📁 فایل در مسیر ${OUTPUT_DIR}/${USERNAME_CLEAN}.txt ذخیره شد"

      - name: Push changes to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add links/
          git commit -m "Extract TikTok links [skip ci]" || echo "Nothing to commit"
          git push
