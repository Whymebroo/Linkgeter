name: tiktok downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'TikTok URL (video or profile)'
        required: true
        type: string
      output_folder:
        description: 'Folder to store downloads'
        required: false
        type: string
        default: 'tiktoks'

permissions:
  contents: write

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -q -U yt-dlp

      - name: Download media
        run: |
          URL="${{ github.event.inputs.video_url }}"
          OUTPUT_FOLDER="${{ github.event.inputs.output_folder }}"

          mkdir -p "$OUTPUT_FOLDER"

          yt-dlp \
            --extractor-args "tiktok:embed_logger" \
            -f "bestvideo[height<=720]+bestaudio/best" \
            --merge-output-format mp4 \
            -o "$OUTPUT_FOLDER/%(title)s.%(ext)s" \
            "$URL"

      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.output_folder }}/"
          git commit -m "Download media" || echo "Nothing to commit"
          git push
