name: tiktok downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'TikTok URL (video or profile)'
        required: true
        type: string

      output_format:
        description: 'Output format'
        required: true
        type: choice
        options:
          - mp4 (video)
          - mp3 (audio only)
          - best (auto)
        default: 'mp4 (video)'

      video_quality:
        description: 'Max video resolution to download'
        required: false
        type: choice
        options:
          - '1080 (Full HD)'
          - '720 (HD)'
          - '480'
          - '360'
          - 'best'
        default: '720 (HD)'

      audio_quality:
        description: 'Audio bitrate — applies to MP3 downloads'
        required: false
        type: choice
        options:
          - '320'
          - '192'
          - '128'
          - '64'
        default: '192'

      output_folder:
        description: 'Folder to store downloads'
        required: false
        type: string
        default: 'tiktoks'

permissions:
  contents: write

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools (optimized for speed)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg aria2
          pip install -q -U yt-dlp

      - name: Download TikTok video (FAST)
        run: |
          URL="${{ github.event.inputs.video_url }}"
          FORMAT_INPUT="${{ github.event.inputs.output_format }}"
          VIDEO_QUALITY="${{ github.event.inputs.video_quality }}"
          AUDIO_Q="${{ github.event.inputs.audio_quality }}"
          OUTPUT_FOLDER="${{ github.event.inputs.output_folder }}"

          mkdir -p "$OUTPUT_FOLDER"

          # استخراج عدد کیفیت (مثلا 720 از "720 (HD)")
          QUALITY_NUM=$(echo "$VIDEO_QUALITY" | grep -o '[0-9]*' | head -1)

          # تنظیمات فرمت و کیفیت
          if [ "$FORMAT_INPUT" = "mp3 (audio only)" ]; then
            FORMAT_ARGS="-x --audio-format mp3 --audio-quality ${AUDIO_Q}K"
          elif [ "$FORMAT_INPUT" = "best (auto)" ] || [ "$VIDEO_QUALITY" = "best" ]; then
            FORMAT_ARGS="-f bestvideo+bestaudio --merge-output-format mp4"
          else
            FORMAT_ARGS="-f bestvideo[height<=${QUALITY_NUM}]+bestaudio --merge-output-format mp4"
          fi

          echo "🚀 شروع دانلود سریع با aria2c..."
          echo "📁 پوشه خروجی: $OUTPUT_FOLDER"
          echo "🎯 کیفیت: ${QUALITY_NUM}p"

          # دانلود سریع با aria2c و fragments همزمان
          yt-dlp \
            --newline \
            --extractor-args "tiktok:embed_logger" \
            --concurrent-fragments 16 \
            --downloader aria2c \
            --downloader-args "aria2c:-x 16 -s 16 -k 1M --file-allocation=none" \
            --no-check-certificate \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            $FORMAT_ARGS \
            -o "$OUTPUT_FOLDER/%(title)s.%(ext)s" \
            "$URL"

          echo "✅ دانلود کامل شد!"
          echo "📊 حجم کل: $(du -sh "$OUTPUT_FOLDER" | cut -f1)"

      - name: Push changes to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.output_folder }}/"
          git commit -m "Download TikTok video [skip ci]" || echo "Nothing to commit"
          git push
