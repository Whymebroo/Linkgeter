name: Tiktoks groups

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: 'اسم فایل توی پوشه links (مثل cristiano.txt)'
        required: true
        type: string
      output_folder:
        description: 'پوشه اصلی ذخیره ویدیوها'
        required: false
        type: string
        default: 'TikToks'

permissions:
  contents: write

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -q -U yt-dlp

      - name: Download all videos from links file
        run: |
          SOURCE_FILE="links/${{ github.event.inputs.source_file }}"
          BASE_OUTPUT="${{ github.event.inputs.output_folder }}"
          
          # گرفتن اسم فایل بدون پسوند .txt
          FILENAME=$(basename "$SOURCE_FILE" .txt)
          OUTPUT_FOLDER="$BASE_OUTPUT/$FILENAME"
          
          # بررسی وجود فایل
          if [ ! -f "$SOURCE_FILE" ]; then
            echo "❌ فایل $SOURCE_FILE پیدا نشد!"
            echo "📁 فایل‌های موجود در پوشه links:"
            ls -la links/ || echo "پوشه links خالی است"
            exit 1
          fi

          mkdir -p "$OUTPUT_FOLDER"

          echo "📁 فایل لینک‌ها: $SOURCE_FILE"
          echo "📁 پوشه خروجی: $OUTPUT_FOLDER"
          
          # استخراج لینک‌ها از فایل (خطوطی که با https شروع می‌شن)
          grep -E "https?://" "$SOURCE_FILE" > /tmp/links.txt
          
          TOTAL=$(wc -l < /tmp/links.txt)
          echo "🔍 تعداد کل لینک‌ها: $TOTAL"
          
          if [ "$TOTAL" -eq 0 ]; then
            echo "❌ هیچ لینکی توی فایل پیدا نشد!"
            exit 1
          fi
          
          # نمایش همه لینک‌ها برای دیباگ
          echo "===== لیست لینک‌ها ====="
          cat /tmp/links.txt
          echo "======================="
          
          COUNT=0
          SUCCESS=0
          FAILED_LINKS=""
          
          while IFS= read -r URL; do
            if [ -n "$URL" ]; then
              COUNT=$((COUNT + 1))
              echo ""
              echo "📥 [$COUNT/$TOTAL] دانلود: $URL"
              
              # حذف کاراکترهای اضافی مثل回车 و فاصله
              URL_CLEAN=$(echo "$URL" | tr -d '\r' | xargs)
              
              if yt-dlp \
                --extractor-args "tiktok:embed_logger" \
                -f "bestvideo[height<=720]+bestaudio/best" \
                --merge-output-format mp4 \
                -o "$OUTPUT_FOLDER/%(title)s.%(ext)s" \
                "$URL_CLEAN"; then
                SUCCESS=$((SUCCESS + 1))
                echo "✅ موفق"
              else
                echo "❌ خطا در دانلود: $URL_CLEAN"
                FAILED_LINKS="$FAILED_LINKS\n$URL_CLEAN"
              fi
            fi
          done < /tmp/links.txt
          
          echo ""
          echo "========== جمع‌بندی =========="
          echo "✅ دانلود موفق: $SUCCESS از $COUNT"
          echo "📁 پوشه خروجی: $OUTPUT_FOLDER"
          echo "📊 فایل‌های ذخیره شده:"
          ls -la "$OUTPUT_FOLDER/" || echo "هیچ فایلی ذخیره نشد"
          
          if [ -n "$FAILED_LINKS" ]; then
            echo ""
            echo "❌ لینک‌های ناموفق:"
            echo -e "$FAILED_LINKS"
          fi

      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.output_folder }}/"
          git commit -m "Download TikTok videos" || echo "Nothing to commit"
          git push
