name: tiktok downloader

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: 'اسم فایل توی پوشه links (مثل cristiano.txt)'
        required: true
        type: string
      output_folder:
        description: 'پوشه ذخیره ویدیوها'
        required: false
        type: string
        default: 'tiktoks'

permissions:
  contents: write

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -q -U yt-dlp

      - name: Download all videos from links file
        run: |
          SOURCE_FILE="links/${{ github.event.inputs.source_file }}"
          OUTPUT_FOLDER="${{ github.event.inputs.output_folder }}"

          # بررسی وجود فایل
          if [ ! -f "$SOURCE_FILE" ]; then
            echo "❌ فایل $SOURCE_FILE پیدا نشد!"
            echo "📁 فایل‌های موجود در پوشه links:"
            ls -la links/ || echo "پوشه links خالی است"
            exit 1
          fi

          mkdir -p "$OUTPUT_FOLDER"

          echo "📁 خواندن لینک‌ها از: $SOURCE_FILE"
          
          # استخراج لینک‌ها از فایل (خطوطی که با https شروع می‌شن)
          grep -E "https?://" "$SOURCE_FILE" > /tmp/links.txt
          
          TOTAL=$(wc -l < /tmp/links.txt)
          echo "🔍 تعداد لینک‌های پیدا شده: $TOTAL"
          
          if [ "$TOTAL" -eq 0 ]; then
            echo "❌ هیچ لینکی توی فایل پیدا نشد!"
            exit 1
          fi
          
          # نمایش چند لینک اول
          echo "===== لینک‌ها ====="
          head -5 /tmp/links.txt
          echo "..."
          echo "=================="
          
          COUNT=0
          SUCCESS=0
          
          while IFS= read -r URL; do
            if [ -n "$URL" ]; then
              COUNT=$((COUNT + 1))
              echo ""
              echo "📥 [$COUNT/$TOTAL] دانلود: $URL"
              
              if yt-dlp \
                --extractor-args "tiktok:embed_logger" \
                -f "bestvideo[height<=720]+bestaudio/best" \
                --merge-output-format mp4 \
                -o "$OUTPUT_FOLDER/%(title)s.%(ext)s" \
                "$URL"; then
                SUCCESS=$((SUCCESS + 1))
                echo "✅ موفق"
              else
                echo "❌ خطا در دانلود"
              fi
            fi
          done < /tmp/links.txt
          
          echo ""
          echo "========== جمع‌بندی =========="
          echo "✅ دانلود موفق: $SUCCESS از $COUNT"
          echo "📁 پوشه خروجی: $OUTPUT_FOLDER"
          ls -la "$OUTPUT_FOLDER/"

      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.output_folder }}/"
          git commit -m "Download TikTok videos" || echo "Nothing to commit"
          git push
