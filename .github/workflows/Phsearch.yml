name: PH Search Scraper

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'کلمه جستجو (مثلاً Masturbation)'
        required: true
        type: string
      video_count:
        description: 'تعداد ویدیو'
        required: false
        type: number
        default: 10
      sort_by:
        description: 'مرتب‌سازی'
        required: false
        type: choice
        options:
          - relevance
          - newest
          - mostviewed
          - rating
        default: 'newest'

permissions:
  contents: write

jobs:
  scrape-pornhub:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium --with-deps

      - name: Scrape Pornhub
        run: |
          python scrape_ph.py \
            --query "${{ github.event.inputs.search_query }}" \
            --count ${{ github.event.inputs.video_count }} \
            --sort ${{ github.event.inputs.sort_by }}

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PhResults/ || true
          git commit -m "Update PH search results - $(date '+%Y-%m-%d %H:%M')" || echo "No changes"
          git push
