name: دانلودر پی اچ (پیشرفته)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the video'
        required: true
        type: string
      quality:
        description: 'Video quality'
        required: false
        type: string
        default: 'best'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp
        run: |
          pip install -U yt-dlp
          yt-dlp --version

      - name: Download Video dengan Teknik Impersonate
        run: |
          URL="${{ github.event.inputs.url }}"
          QUALITY="${{ github.event.inputs.quality }}"

          mkdir -p PhVideo

          echo "🔍 در حال بررسی لینک: $URL"
          echo "⚙️ کیفیت انتخابی: $QUALITY"

          # تکنیک‌های کلیدی برای رفع ارور سایت‌های بزرگسالان
          yt-dlp \
            --output "PhVideo/%(title)s.%(ext)s" \
            --format "$QUALITY" \
            --merge-output-format mp4 \
            --no-check-certificate \
            --geo-bypass \
            --impersonate chrome \          # [حیاتی] تقلید از مرورگر کروم (رفع 403)
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --referer "https://www.google.com/" \  # مخفی کردن منبع درخواست
            --add-header "Accept-Language: en-US,en;q=0.9" \
            --sleep-interval 5 \              # تاخیر برای جلوگیری از مسدود شدن IP
            --max-sleep-interval 10 \
            --verbose \                       # نمایش جزئیات کامل برای دیباگ
            "$URL"

          echo "✅ دانلود با موفقیت انجام شد!"
          ls -la PhVideo/

      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git add PhVideo/
          git commit -m "Download video with impersonate technique" || echo "Nothing to commit"
          git push
