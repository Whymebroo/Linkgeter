name: دانلودر پی اچ

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the video'
        required: true
        type: string
      quality:
        description: 'Video quality'
        required: false
        type: choice
        options:
          - '720'
          - '480'
          - '360'
          - 'best'
        default: '720'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp
        run: |
          pip install --upgrade yt-dlp
          yt-dlp --version

      - name: Download video
        run: |
          URL="${{ github.event.inputs.url }}"
          QUALITY="${{ github.event.inputs.quality }}"
          
          mkdir -p PhVideo
          
          echo "🔍 URL: $URL"
          echo "⚙️ کیفیت: $QUALITY"
          
          # انتخاب فرمت مناسب بر اساس کیفیت
          if [ "$QUALITY" = "720" ]; then
            FORMAT="bestvideo[height<=720]+bestaudio/best[height<=720]"
          elif [ "$QUALITY" = "480" ]; then
            FORMAT="bestvideo[height<=480]+bestaudio/best[height<=480]"
          elif [ "$QUALITY" = "360" ]; then
            FORMAT="bestvideo[height<=360]+bestaudio/best[height<=360]"
          else
            FORMAT="bestvideo+bestaudio/best"
          fi
          
          echo "📥 فرمت انتخابی: $FORMAT"
          
          # دانلود
          yt-dlp \
            --output "PhVideo/%(title)s.%(ext)s" \
            --format "$FORMAT" \
            --merge-output-format mp4 \
            --no-check-certificate \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "$URL"
          
          if [ $? -eq 0 ]; then
            echo "✅ دانلود کامل شد!"
            ls -la PhVideo/
          else
            echo "❌ خطا در دانلود"
            exit 1
          fi

      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git add PhVideo/
          git commit -m "Download video" || echo "Nothing to commit"
          git push
